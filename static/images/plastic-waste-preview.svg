<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ecoBg)" />

  <!-- App Window -->
  <rect x="70" y="50" width="660" height="350" rx="14" fill="#06251E" stroke="#047857" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#044E3B" />
  <circle cx="100" cy="73" r="6" fill="#10B981" />
  <circle cx="120" cy="73" r="6" fill="#34D399" />
  <circle cx="140" cy="73" r="6" fill="#6EE7B7" />
  <text x="400" y="78" fill="#ECFDF5" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Plastic Recycling &amp; Waste Stream Telemetry</text>

  <!-- Metrics Row -->
  <!-- Stat 1 -->
  <rect x="100" y="120" width="170" height="85" rx="8" fill="#04382B" stroke="#059669" stroke-width="1" />
  <text x="115" y="142" fill="#A7F3D0" font-family="sans-serif" font-size="11">TOTAL PLASTIC LOGGED</text>
  <text x="115" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">1,480 kg</text>
  <text x="115" y="192" fill="#34D399" font-family="sans-serif" font-size="10">↑ +14% this month</text>

  <!-- Stat 2 -->
  <rect x="315" y="120" width="170" height="85" rx="8" fill="#04382B" stroke="#059669" stroke-width="1" />
  <text x="330" y="142" fill="#A7F3D0" font-family="sans-serif" font-size="11">RECYCLING CREDITS</text>
  <text x="330" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">8,920 pts</text>
  <text x="330" y="192" fill="#34D399" font-family="sans-serif" font-size="10">Awarded to citizens</text>

  <!-- Stat 3 -->
  <rect x="530" y="120" width="170" height="85" rx="8" fill="#04382B" stroke="#059669" stroke-width="1" />
  <text x="545" y="142" fill="#A7F3D0" font-family="sans-serif" font-size="11">COLLECTION DEPOTS</text>
  <text x="545" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">12 Active</text>
  <text x="545" y="192" fill="#34D399" font-family="sans-serif" font-size="10">City-wide centers</text>

  <!-- Classification Bars -->
  <rect x="100" y="230" width="600" height="145" rx="10" fill="#021C16" stroke="#064E3B" />
  <text x="125" y="260" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="bold">Material Breakdown &amp; Segregation Efficiency</text>
  
  <text x="125" y="290" fill="#94A3B8" font-family="sans-serif" font-size="11">PET (Bottles)</text>
  <rect x="220" y="280" width="450" height="12" rx="6" fill="#064E3B" />
  <rect x="220" y="280" width="360" height="12" rx="6" fill="#10B981" />

  <text x="125" y="320" fill="#94A3B8" font-family="sans-serif" font-size="11">HDPE (Containers)</text>
  <rect x="220" y="310" width="450" height="12" rx="6" fill="#064E3B" />
  <rect x="220" y="310" width="280" height="12" rx="6" fill="#34D399" />

  <text x="125" y="350" fill="#94A3B8" font-family="sans-serif" font-size="11">LDPE (Bags &amp; Wraps)</text>
  <rect x="220" y="340" width="450" height="12" rx="6" fill="#064E3B" />
  <rect x="220" y="340" width="200" height="12" rx="6" fill="#6EE7B7" />
</svg>
