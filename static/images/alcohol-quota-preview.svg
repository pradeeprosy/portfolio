<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="regBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#regBg)" />

  <!-- App Window -->
  <rect x="70" y="50" width="660" height="350" rx="14" fill="#020617" stroke="#334155" stroke-width="1.5" />
  
  <!-- App Header -->
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#1E293B" />
  <circle cx="100" cy="73" r="6" fill="#EF4444" />
  <circle cx="120" cy="73" r="6" fill="#F59E0B" />
  <circle cx="140" cy="73" r="6" fill="#10B981" />
  <text x="400" y="78" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Alcohol Quota &amp; Compliance Monitoring Engine</text>

  <!-- Left Column: User Verification Card -->
  <rect x="100" y="120" width="280" height="250" rx="10" fill="#0F172A" stroke="#1E293B" />
  <text x="120" y="150" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold">Buyer Verification &amp; Age Screening</text>
  
  <rect x="120" y="170" width="240" height="32" rx="6" fill="#1E293B" />
  <text x="135" y="190" fill="#94A3B8" font-family="monospace" font-size="12">ID: KA-REG-2024-8831</text>

  <rect x="120" y="215" width="110" height="26" rx="6" fill="#10B981" fill-opacity="0.2" />
  <text x="175" y="232" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Age: Verified 21+</text>

  <text x="120" y="275" fill="#E2E8F0" font-family="sans-serif" font-size="12">Monthly Allocation Remaining:</text>
  <rect x="120" y="290" width="240" height="12" rx="6" fill="#334155" />
  <rect x="120" y="290" width="160" height="12" rx="6" fill="url(#barGrad)" />
  <text x="120" y="325" fill="#94A3B8" font-family="sans-serif" font-size="11">Used: 2.0L / Cap: 3.0L</text>

  <!-- Right Column: POS Transaction Audit Log -->
  <rect x="410" y="120" width="290" height="250" rx="10" fill="#0F172A" stroke="#1E293B" />
  <text x="430" y="150" fill="#818CF8" font-family="sans-serif" font-size="13" font-weight="bold">Point-of-Sale Ledger Records</text>

  <!-- Row 1 -->
  <rect x="430" y="170" width="250" height="42" rx="6" fill="#1E293B" />
  <text x="445" y="190" fill="#F8FAFC" font-family="sans-serif" font-size="12">Outlet #04 · Approved</text>
  <text x="445" y="204" fill="#94A3B8" font-family="sans-serif" font-size="10">TXN-90214 · Quota Updated: -750ml</text>

  <!-- Row 2 -->
  <rect x="430" y="222" width="250" height="42" rx="6" fill="#1E293B" />
  <text x="445" y="242" fill="#F8FAFC" font-family="sans-serif" font-size="12">Outlet #01 · Approved</text>
  <text x="445" y="256" fill="#94A3B8" font-family="sans-serif" font-size="10">TXN-88402 · Quota Updated: -1250ml</text>

  <!-- Warning Banner -->
  <rect x="430" y="278" width="250" height="60" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-width="1" />
  <text x="445" y="302" fill="#FCA5A5" font-family="sans-serif" font-size="12" font-weight="bold">Regulatory Cap Warning</text>
  <text x="445" y="322" fill="#F87171" font-family="sans-serif" font-size="10">Next purchase exceeds threshold allowance.</text>
</svg>
