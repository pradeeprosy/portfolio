<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="450" fill="url(#chatBg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#38BDF8" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Window Mockup -->
  <rect x="80" y="45" width="640" height="360" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <!-- Title bar -->
  <rect x="80" y="45" width="640" height="42" rx="12" fill="#1E293B" />
  <circle cx="110" cy="66" r="6" fill="#EF4444" />
  <circle cx="130" cy="66" r="6" fill="#F59E0B" />
  <circle cx="150" cy="66" r="6" fill="#10B981" />
  <text x="400" y="71" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AI College Assistant · Streamlit &amp; NLP</text>

  <!-- Bot Message -->
  <rect x="120" y="120" width="38" height="38" rx="19" fill="#4F46E5" />
  <text x="139" y="144" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AI</text>
  <rect x="175" y="115" width="380" height="60" rx="10" fill="#1E293B" stroke="#334155" />
  <text x="195" y="140" fill="#E2E8F0" font-family="sans-serif" font-size="13">Hello! Ask me anything regarding admissions, courses,</text>
  <text x="195" y="160" fill="#94A3B8" font-family="sans-serif" font-size="12">faculty directories, or semester examination schedules.</text>

  <!-- User Query -->
  <rect x="360" y="195" width="310" height="48" rx="10" fill="url(#bubbleUser)" />
  <text x="380" y="224" fill="#FFFFFF" font-family="sans-serif" font-size="13">What are the eligibility criteria for CSE Admissions?</text>

  <!-- Bot Response with Semantic Match Badge -->
  <rect x="120" y="265" width="38" height="38" rx="19" fill="#4F46E5" />
  <text x="139" y="289" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AI</text>
  <rect x="175" y="260" width="460" height="75" rx="10" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5" />
  <rect x="195" y="272" width="135" height="18" rx="9" fill="#10B981" fill-opacity="0.2" />
  <text x="262" y="285" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Vector Match: 96.4%</text>
  <text x="195" y="308" fill="#E2E8F0" font-family="sans-serif" font-size="13">B.E. Computer Science requires 10+2 with Physics &amp; Math.</text>
  <text x="195" y="324" fill="#94A3B8" font-family="sans-serif" font-size="11">Retrieved from institutional handbook / section 4.2</text>

  <!-- Bottom Input Bar Mockup -->
  <rect x="120" y="355" width="560" height="36" rx="8" fill="#1E293B" stroke="#334155" />
  <text x="140" y="378" fill="#64748B" font-family="sans-serif" font-size="13">Type your question here (e.g. library timings, bus routes)...</text>
  <rect x="630" y="360" width="42" height="26" rx="6" fill="#38BDF8" />
  <path d="M646 368 L656 373 L646 378 Z" fill="#0B1120" />
</svg>
