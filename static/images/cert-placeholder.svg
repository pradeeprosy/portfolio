<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#certBg)" stroke="#334155" stroke-width="2" />
  <rect x="15" y="15" width="370" height="250" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Seal / Medal -->
  <circle cx="200" cy="90" r="36" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M190 90 L197 97 L212 82" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="200" y="155" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">VERIFIED CREDENTIAL</text>
  <text x="200" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Certificate Placeholder</text>
  <text x="200" y="200" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">Attach credential link or PDF in portfolio.json</text>

  <rect x="130" y="222" width="140" height="26" rx="13" fill="#334155" />
  <text x="200" y="239" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">● ACCREDITED</text>
</svg>
